[project]
name = "baseball-v2"
version = "0.1.0"
description = "Betting analytics: persistence layer and CLV measurement loop"
# claude.md specifies Python 3.12. Kept as a floor rather than a pin, because
# nothing here uses a feature newer than StrEnum (3.11).
#
# Development and CI run 3.13.7 (see .python-version), NOT 3.14. Phase 2 brings
# pybaseball, which pulls pandas, numpy, lxml, bs4 and matplotlib; being on the
# newest interpreter buys nothing here and costs an afternoon the first time a
# wheel is not built for it. 3.14 also deprecates the asyncio policy API and
# asyncio.iscoroutinefunction, both of which this project had to route around.
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy>=2.0.51",
    "alembic>=1.18",
    # psycopg3, not psycopg2: one driver serves both the async app and
    # Alembic's sync migration runner. asyncpg is faster but async-only,
    # which would mean a second driver and a second URL to keep in sync.
    "psycopg[binary]>=3.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `database.migrations` is deliberately absent: Alembic locates it by
# filesystem path via `script_location`, never by import.
packages = ["betting", "database", "ingestion"]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Async fixtures live for the whole session (one Postgres engine, one
# schema creation) rather than being torn down per test.
asyncio_default_fixture_loop_scope = "session"
# Query-plan tests bulk-load 50k rows and are deselected locally so the
# inner loop stays fast. CI runs them as their own job - they only guard
# against a silent index regression if they actually run somewhere.
addopts = "-m 'not performance'"
markers = [
    "postgres: requires a live Postgres 16 (docker compose up -d postgres)",
    "performance: asserts on query plans; needs bulk data. Deselect with -m 'not performance'",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["betting", "database"]

[tool.ruff]
target-version = "py313"
line-length = 88
# Generated, and their already-applied history must not be rewritten to
# satisfy a linter.
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear - real bug patterns, not style
    "C4",       # comprehension simplifications
    "SIM",      # simplifications
    "PT",       # pytest idioms
    "RUF",      # ruff's own checks
]
ignore = [
    # argparse type-callables deliberately `raise ... from None`: argparse
    # prints the chained traceback in full, which buries the message the
    # user actually needs to read.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Fixture builders take many keyword arguments by design; the alternative is
# a config object that makes every test read worse.
"tests/conftest.py" = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["betting", "database", "config"]

[tool.mypy]
python_version = "3.13"
files = ["betting", "database", "config.py"]
exclude = "database/migrations/versions"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# argparse handlers receive a Namespace whose attributes are defined by the
# parser, not by a type. Annotating them would mean a TypedDict per
# subcommand duplicating build_parser() and free to drift from it.
module = "betting.cli"
disallow_untyped_defs = false
disallow_incomplete_defs = false
