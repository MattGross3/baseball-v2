name: CI

# The point of this file is `alembic check`. A test that models and
# migrations agree is near-worthless as something a person might remember to
# run locally, and very valuable as a gate that makes drift unmergeable. The
# same goes for the query-plan tests: they only catch a silent index
# regression if they actually run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Port 5433, matching docker-compose.yml and .env.example.
  #
  # The runner could use 5432 - the service container is the only Postgres
  # here - but then CI and development would differ in a way that has to be
  # special-cased somewhere. It already was: the conftest guard refuses port
  # 5432 outright, and this workflow's first run failed on exactly that.
  # Making the two environments identical is cheaper than teaching the guard
  # which machine it is on.
  DATABASE_URL: postgresql+psycopg://baseball:baseball@localhost:5433/baseball
  TEST_DATABASE_URL: postgresql+psycopg://baseball:baseball@localhost:5433/baseball_test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the version in docker-compose.yml. The schema relies on
        # Postgres 15+ behaviour (UNIQUE NULLS NOT DISTINCT), so an older
        # image would fail in a way that looks like a code bug.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baseball
          POSTGRES_PASSWORD: baseball
          POSTGRES_DB: baseball
        ports:
          # Host 5433 -> container 5432, matching docker-compose.yml.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U baseball -d baseball"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Models match migrations
        # The highest-value check here. A column added to a model but not to
        # a migration passes every test that builds its schema from metadata
        # and fails only on a real deployment.
        run: alembic check

      - name: Migration round-trip
        # A downgrade that does not work is discovered when it is needed
        # under pressure, unless something exercises it routinely.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

      # Deselected locally (see addopts) because they bulk-load rows, so CI
      # is the only place they run. An index silently going unused is
      # invisible to every other test - the query still returns correct
      # rows, just by reading the whole table.
      - name: Query-plan tests
        run: pytest -q -m performance

  # Secret scanning runs on every push and on the full history, not just the
  # diff: this repository is private today and may not always be, and a key
  # committed once stays in the history after it is deleted from HEAD.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the scanner directly rather than through gitleaks-action, which
      # failed with "stderr is not empty" after scanning ~0 bytes - it
      # reported success on a scan that never happened, which is the worst
      # possible behaviour for a secret scanner.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:latest
          detect --source=/repo --redact --verbose --no-banner
