[alembic]
script_location = %(here)s/database/migrations
prepend_sys_path = .
path_separator = os

# Deliberately blank. env.py resolves the URL from config.settings (which
# reads .env), or from `-x db_url=...`, so there is never a connection string
# committed here and the test suite can point at a scratch database without
# editing a tracked file.
sqlalchemy.url =

# 0001_description.py - zero-padded so `ls` sorts the same way the revision
# chain runs.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
