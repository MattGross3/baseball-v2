# Phase 0 runs no application containers - only Postgres, for local dev and
# for the test suite. The constraints this schema relies on (CHECK, TIMESTAMPTZ
# semantics, partial indexes, NULLs in btree) are Postgres behaviours, so
# testing against SQLite would prove nothing about production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
      POSTGRES_DB: baseball
    ports:
      # BOUND TO LOOPBACK. The 127.0.0.1 prefix is not decoration.
      #
      # Docker writes published ports into iptables in the DOCKER chain,
      # which is evaluated BEFORE ufw's rules. A bare "5433:5432" is
      # therefore reachable from the internet even while `ufw status` shows
      # the port denied - the firewall is telling the truth about its own
      # rules and is simply not in the path. Binding to 127.0.0.1 means
      # Docker never publishes on the public interface at all, so there is
      # nothing for ufw to have to block.
      #
      # 5433 rather than 5432 because a native PostgreSQL install on the
      # development machine owns 5432 and holds another project's live
      # database. Both processes accept the bind and host connections reach
      # whichever won the race, so migrations could land on the wrong data.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns success as soon as the postmaster accepts
      # connections, which is earlier than "the database is usable" - fine
      # here because migrations run separately, not as a compose dependency.
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
